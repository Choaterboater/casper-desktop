# Casper CI: the checks this repository runs on GitHub's own runners.
#
# GitHub runs every workflow file in this folder, so this is the only one here.
# Upstream's workflows need upstream's secrets, self-hosted runners and release
# accounts. They are kept unedited in .github/upstream-workflows/, where GitHub never
# runs them, and git's rename detection still merges upstream's edits into them.
# scripts/casper-workflows.spec.ts fails the unit tests below while this folder holds
# any other workflow file; the README's Development section says what to do when an
# upstream merge adds one.
name: Casper CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Nothing in CI reports to upstream's telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: static, types and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Full history: the archived-notes gate compares against the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: pnpm run check:ci:static

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint and duplication
        run: pnpm run check:ci:lint:contracts-ready

  tests:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # GitHub's 4-CPU runner runs the whole suite at once, where upstream used 16-core machines. The git-backed
      # forge and worktree tests pass alone but ran past the 5-second default here, so this raises the per-test,
      # hook and poll budgets together, as upstream's hosted lanes do.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
      # The package scripts/prepare-ci-bubblewrap.sh pins; scripts/casper-workflows.spec.ts keeps these in step with it.
      BUBBLEWRAP_DEB: bubblewrap_0.12.0-1_amd64.deb
      BUBBLEWRAP_LAUNCHPAD_URL: https://launchpad.net/ubuntu/+source/bubblewrap/0.12.0-1/+build/33546835/+files/bubblewrap_0.12.0-1_amd64.deb
      BUBBLEWRAP_ARCHIVE_URL: https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.12.0-1_amd64.deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The sandbox tests use bubblewrap, which Ubuntu runners restrict by default. Launchpad, the
      # script's pinned source, has outages, so the package comes from GitHub's cache after its first
      # verified download. Before that, Ubuntu's archive serves the same file when Launchpad fails;
      # it prunes old packages, so it is only the fallback. The script checks the sha256 either way.
      - name: Restore bubblewrap package
        id: bubblewrap-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/${{ env.BUBBLEWRAP_DEB }}
          key: ${{ env.BUBBLEWRAP_DEB }}

      - name: Fetch bubblewrap package
        if: steps.bubblewrap-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/$BUBBLEWRAP_DEB" "$BUBBLEWRAP_LAUNCHPAD_URL" \
            || curl --fail --silent --show-error --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/$BUBBLEWRAP_DEB" "$BUBBLEWRAP_ARCHIVE_URL"

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Saved only after the script verified the package, and before the tests, so a failing test does not skip it.
      - name: Save bubblewrap package
        if: steps.bubblewrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/${{ env.BUBBLEWRAP_DEB }}
          key: ${{ env.BUBBLEWRAP_DEB }}

      - name: Unit tests
        run: pnpm run check:ci:unit
